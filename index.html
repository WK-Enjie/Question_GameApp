<div id="question-section" class="question-section">
    <div id="question-text" class="question-text">Loading...</div>
    <div id="options-container" class="options-container"></div>
    
    <div class="game-controls">
        <button id="submit-answer" class="btn primary btn-large">Submit Answer</button>
    </div>
</div>

<div id="choice-section" class="choice-section" style="display: none;">
    <h3>✨ Correct! Choose your Path:</h3>
    <div class="choice-buttons">
        <button id="choose-box-btn" class="btn secondary">
            🎁 Open Treasure Box <br><small>(Safe Bonus)</small>
        </button>
        <div class="divider-vertical">OR</div>
        <button id="choose-risk-btn" class="btn primary">
            🎲 Risk It! <br><small>(Hit for +50% Points)</small>
        </button>
    </div>
</div>

<div id="treasure-section" class="treasure-section" style="display: none;">
    <h3>🎁 Pick a Box!</h3>
    <div class="treasure-boxes">
        <div class="treasure-box" data-box="1">❓</div>
        <div class="treasure-box" data-box="2">❓</div>
        <div class="treasure-box" data-box="3">❓</div>
    </div>
    <div id="powerup-result"></div>
</div>

<div id="blackjack-controls" class="blackjack-controls" style="display: none;">
    <div class="blackjack-info">
        <span>Round Score: <strong id="current-round-total" style="font-size:1.5em; color:#ffd700;">0</strong> / 50</span>
    </div>
    <div class="blackjack-buttons">
        <button id="hit-btn" class="btn-hit">🔥 HIT (+50%)</button>
        <button id="stand-btn" class="btn-stand">✅ STAND (Bank)</button>
    </div>
</div>

<div id="answer-feedback" class="answer-feedback"></div>
