<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNY Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧧 CNY Quiz 50 🧧</h1>
            <div class="subtitle">Target: 50 Points</div>
        </header>

        <div id="pin-screen" class="screen active">
            <div class="pin-input-section">
                <h2>Enter Quiz Code</h2>
                <div class="pin-display">
                    <div class="digit" id="digit1"><span class="digit-number">_</span></div>
                    <div class="digit" id="digit2"><span class="digit-number">_</span></div>
                    <div class="digit" id="digit3"><span class="digit-number">_</span></div>
                    <div class="digit" id="digit4"><span class="digit-number">_</span></div>
                    <div class="digit" id="digit5"><span class="digit-number">_</span></div>
                    <div class="digit" id="digit6"><span class="digit-number">_</span></div>
                </div>
                <div class="keypad">
                    <button class="key" data-key="1">1</button>
                    <button class="key" data-key="2">2</button>
                    <button class="key" data-key="3">3</button>
                    <button class="key" data-key="4">4</button>
                    <button class="key" data-key="5">5</button>
                    <button class="key" data-key="6">6</button>
                    <button class="key" data-key="7">7</button>
                    <button class="key" data-key="8">8</button>
                    <button class="key" data-key="9">9</button>
                    <button class="key clear" id="clear-btn">⌫</button>
                    <button class="key" data-key="0">0</button>
                    <button class="key submit" id="submit-pin">GO</button>
                </div>
                <div class="quick-actions">
                    <label class="btn secondary">
                        Upload JSON
                        <input type="file" id="json-upload" hidden accept=".json">
                    </label>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="screen">
            <div class="loading-content">
                <div class="spinner"></div>
                <h2 id="loading-message">Loading...</h2>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="player-info">
                <div class="player-card" id="player1">
                    <h3>Player 1</h3>
                    <div class="total-score" id="score1">0</div>
                </div>
                <div class="vs-badge">VS</div>
                <div class="player-card" id="player2">
                    <h3>Player 2</h3>
                    <div class="total-score" id="score2">0</div>
                </div>
            </div>

            <div class="turn-banner">
                <span id="current-player-name">Player 1's Turn</span>
                <span class="q-counter">Q: <span id="current-q">1</span>/<span id="total-q">10</span></span>
            </div>

            <div class="question-area">
                <h3 id="question-text">Loading Question...</h3>
                <div id="options-container" class="options-grid"></div>
                <button id="submit-answer" class="btn primary btn-block">Submit Answer</button>
            </div>

            <div id="choice-section" class="phase-section">
                <div class="phase-header">CORRECT! CHOOSE YOUR PATH</div>
                <div class="choice-grid">
                    <div class="choice-card" id="btn-choose-box">
                        <div class="icon">🎁</div>
                        <h4>Treasure Box</h4>
                    </div>
                    <div class="choice-card risk" id="btn-choose-risk">
                        <div class="icon">🎲</div>
                        <h4>Risk It!</h4>
                    </div>
                </div>
            </div>

            <div id="treasure-section" class="phase-section">
                <h3>Pick a Box!</h3>
                <div class="treasure-grid">
                    <div class="t-box" data-id="1">?</div>
                    <div class="t-box" data-id="2">?</div>
                    <div class="t-box" data-id="3">?</div>
                </div>
                <div id="treasure-result"></div>
            </div>

            <div id="risk-section" class="phase-section">
                <div class="risk-score">Score: <span id="risk-display">0</span> / 50</div>
                <div class="risk-controls">
                    <button id="btn-hit" class="btn danger">HIT</button>
                    <button id="btn-stand" class="btn success">STAND</button>
                </div>
            </div>

            <div id="feedback-area" class="feedback-area"></div>
        </div>

        <div id="game-over-screen" class="screen">
            <h1>Game Over</h1>
            <h2 id="winner-text">Player 1 Wins!</h2>
            <div class="final-scores">
                <p>Player 1: <span id="final-p1">0</span></p>
                <p>Player 2: <span id="final-p2">0</span></p>
            </div>
            <button id="btn-home" class="btn primary">Restart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
